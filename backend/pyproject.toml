[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.0.1"
description = "Kernel de simulación agronómica explicable (FAO-56) — Field Shift / AlairaX"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
api = ["fastapi", "uvicorn"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
